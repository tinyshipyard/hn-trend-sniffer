name: "HackerNews Trend Sniffer"

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Trend Sniffer Generator
        run: node index.js

      - name: Deploy to GitHub Pages / Commit Feed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes in public/
          git status
          git add public/
          
          if git diff --staged --quiet; then
            echo "No changes to public feeds."
          else
            git commit -m "chore: update HN trend feeds [skip ci]"
            git push origin HEAD:main
          fi
